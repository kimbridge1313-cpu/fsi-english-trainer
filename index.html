<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f5f1"><title>FSI Lab — Chunks × FSI</title>
<style>
:root{--bg:#f7f5f1;--fg:#272620;--mute:#75746f;--line:#e5e1db;--card:#fff;--accent:#ce4a1c;--accentSoft:#fceee8;--success:#207859;--round:18px}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--fg);font-size:15px;line-height:1.55}button{font:inherit;cursor:pointer}button:disabled{opacity:.5;cursor:default}a{color:inherit}header{position:sticky;top:0;background:#f7f5f1ed;border-bottom:1px solid var(--line);backdrop-filter:blur(14px);z-index:10}.wrap{max-width:860px;margin:0 auto;padding:0 20px}.hdr{height:63px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{letter-spacing:.065em;font-size:13px;font-weight:800}.brand b{color:var(--accent)}.tiny{font-size:11px;color:var(--mute);letter-spacing:.05em}.ghost{border:1px solid var(--line);padding:8px 12px;background:transparent;border-radius:11px;color:var(--fg)}.page{padding:26px 20px 70px}.eyebrow{font-size:11px;letter-spacing:.13em;font-weight:800;color:var(--accent);text-transform:uppercase}.hero{margin-bottom:24px}.hero h1{font-weight:750;letter-spacing:-.035em;font-size:clamp(28px,5vw,40px);margin:9px 0}.hero p{color:var(--mute);margin:0;max-width:620px;font-size:13px}.sectionnav{display:flex;gap:7px;flex-wrap:wrap;margin:23px 0 16px}.tab{border:1px solid var(--line);background:white;padding:8px 13px;border-radius:100px;color:var(--mute);font-weight:650;font-size:12px}.tab.active{background:var(--fg);color:white;border-color:var(--fg)}.panel{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:clamp(17px,3vw,31px);box-shadow:0 9px 45px #20201806}.panelhd{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-bottom:19px;border-bottom:1px solid var(--line)}.panelhd h2{font-size:19px;margin:2px 0;letter-spacing:-.025em}.pill{font-size:11px;border-radius:99px;color:var(--mute);border:1px solid var(--line);padding:5px 9px;white-space:nowrap}.prompt{border-radius:16px;background:#f4f3ef;padding:24px;margin-top:18px}.prompt .caption,.cue .caption,.answer .caption{color:var(--mute);font-size:11px;font-weight:700;letter-spacing:.06em;margin:0 0 6px}.maintext{font-size:clamp(24px,4.5vw,36px);font-weight:750;line-height:1.35;letter-spacing:-.035em;overflow-wrap:anywhere}.cue{padding:21px 2px}.cue .maintext{font-size:clamp(27px,5.5vw,44px)}.sentence{font-size:clamp(19px,4vw,28px);font-weight:730;line-height:1.4;letter-spacing:-.02em}.answer{border:1px solid #d7d7cf;border-radius:16px;padding:19px;margin-top:14px}.explain{color:var(--mute);font-size:12px;margin:12px 0}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:15px}.btn{border-radius:12px;padding:12px 17px;font-size:14px;border:1px solid var(--line);font-weight:720;background:#fff;color:var(--fg)}.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}.btn.full{flex:1}.btn.quiet{background:#f4f3ef}.progress{height:4px;border-radius:10px;background:#ebe9e3;overflow:hidden;margin-top:13px}.progress div{height:100%;background:var(--accent);transition:width .2s}.linkrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:17px}.linkrow a{font-size:12px;text-decoration:underline;color:var(--mute)}.meta{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:18px 0}.meta div{background:#f0eee9;border-radius:11px;padding:10px}.meta b{display:block;font-size:15px}.meta small{color:var(--mute);font-size:10px}.toast{color:#89452e;font-size:12px;min-height:18px;margin-top:12px}.mini-cards{display:grid;gap:8px;margin-top:15px}.mini-cards div{border:1px solid var(--line);border-radius:12px;padding:11px;font-size:13px}.hide{display:none!important}.desc{font-size:12px;color:var(--mute)}.donebox{text-align:center;padding:38px 0}.donebox h2{font-size:30px;margin:12px 0}.foot{color:var(--mute);font-size:11px;margin:16px 0;text-align:center}.badge{font-size:11px;color:var(--accent);background:var(--accentSoft);padding:4px 9px;border-radius:99px}.quote{border-left:3px solid var(--accent);padding-left:13px;margin:15px 0}.stage-label{font-weight:800;color:var(--mute);font-size:11px;letter-spacing:.08em}.speaker{display:inline-block;background:#e4e3df;padding:3px 9px;border-radius:6px;font-size:11px;font-weight:750;margin-bottom:12px}#status{min-width:10px}@media(max-width:540px){.wrap{padding:0 15px}.page{padding:21px 15px 75px}.panel{border-radius:18px}.actions .btn{flex:1}.meta{grid-template-columns:repeat(3,1fr)}}
.coursebar{margin:18px 0 20px;border:1px solid var(--line);background:#fff;border-radius:var(--round);padding:16px}.course-title{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}.course-title strong{font-size:14px}.course-title span{font-size:11px;color:var(--mute)}.course-grid[hidden]{display:none}.course-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}.course-card{text-align:left;border:1px solid var(--line);border-radius:11px;background:var(--bg);padding:11px 12px;min-height:70px;transition:border-color .15s}.course-card.active{border:2px solid var(--accent);background:#fff5f0;padding:10px 11px}.course-card b{display:block;font-size:13px;color:var(--fg);margin:2px 0}.course-card small{font-size:11px;color:var(--mute)}.course-index{font-size:10px;font-weight:800;color:var(--accent)}.course-card:hover{border-color:var(--accent)}.course-toggle{border:1px solid var(--line);border-radius:9px;background:white;padding:5px 10px;font-size:12px;cursor:pointer}@media(max-width:540px){.course-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.coursebar{padding:13px}.course-card{padding:10px;min-height:75px}.course-card.active{padding:9px}}
</style></head><body>
<header><div class="wrap hdr"><div class="brand">FSI <b>LAB</b> <span style="color:#aaa;font-weight:500">/ ENGLISH</span></div><button id="restart" class="ghost">重新開始</button></div></header><main class="wrap page"><div class="hero"><div class="eyebrow" id="eyebrow">CHUNKS × FSI × CONVERSATION</div><h1 id="title">正在讀取教材…</h1><p id="subtitle">美國國務院 Around Town 十堂主題教材 · Chunks × FSI 六階段訓練</p></div><div id="coursebar"></div><div id="meta"></div><nav class="sectionnav" id="nav"></nav><div class="panel" id="panel"><p>正在載入…</p></div><div class="foot">教材來源：U.S. Department of State · Everyday Conversations<br>改編練習為非官方版本。朗讀由瀏覽器內建語音提供，成績只儲存在此裝置。</div></main>
<script>
'use strict';
const stages=[['chunks','語塊'],['substitution','替換'],['buildup','堆疊'],['transformation','轉換'],['response','問答'],['conversation','完整對話'],['summary','紀錄']];
let lesson=null,manifest=null;
const INITIAL=()=>({stage:'chunks',index:0,step:0,round:0,reveal:false,events:[],cycles:0});
let state=INITIAL(), STORE='fsi-chunks-v1:lesson-01';
let coursesOpen=true;

const $=s=>document.querySelector(s);
const safe=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sayButton=(text,label='▶ 聆聽',rate=0.94)=>`<button class="btn quiet" data-say="${encodeURIComponent(text)}" data-rate="${rate}">${label}</button>`;
function voice(text,rate){if(!window.speechSynthesis){$('#status').textContent='此瀏覽器不支援語音朗讀。';return;}let t=new SpeechSynthesisUtterance(text);t.lang='en-US';t.rate=Number(rate)||1;let voices=speechSynthesis.getVoices();t.voice=voices.find(x=>x.lang.toLowerCase()==='en-us')||voices.find(x=>x.lang.toLowerCase().startsWith('en'))||null;t.onerror=e=>{$('#status').textContent='語音播放失敗，請確認裝置音量與瀏覽器語音設定。'};speechSynthesis.cancel();speechSynthesis.speak(t);}
function save(){try{localStorage.setItem(STORE,JSON.stringify(state))}catch{}}
function resetStep(){state.index=0;state.round=0;state.step=0;state.reveal=false;save();}
function setStage(id){state.stage=id;resetStep();render();}
function count(n){return `${state.index+1} / ${n}`;}
function head(title,counter){return `<div class="panelhd"><div><div class="eyebrow">LESSON ${String(lesson.lesson_number).padStart(2,"0")}</div><h2>${title}</h2></div><span class="pill">${counter}</span></div>`;}
function prompt(label,text,extra=''){return `<div class="prompt"><div class="caption">${safe(label)}</div><div class="maintext">${safe(text)}</div>${extra}</div>`;}
function cue(label,text){return `<div class="cue"><div class="caption">${safe(label)}</div><div class="maintext">${safe(text)}</div></div>`;}
function answer(text,rate=1){return `<div class="answer"><div class="caption">參考答案</div><div class="sentence">${safe(text)}</div><div class="actions">${sayButton(text,'▶ 聽完整句',rate)}</div></div>`;}
function controls(revealLabel='顯示答案'){return state.reveal?`<div class="actions"><button class="btn" data-score="0">還要再練</button><button class="btn primary full" data-score="1">我答得出來 →</button></div>`:`<div class="actions"><button class="btn primary full" id="reveal">${revealLabel}</button></div>`;}
function total(){return ({chunks:lesson.chunks.length,substitution:lesson.drills.substitution.items.length,buildup:lesson.drills.buildup.items.length,transformation:lesson.drills.transformation.items.length,response:lesson.drills.response.pairs.length,conversation:lesson.conversation.rounds[0].pairs.length})[state.stage]||1;}
function sectionNext(){let p=stages.findIndex(x=>x[0]===state.stage);state.stage=stages[Math.min(p+1,6)][0];resetStep();render();}
function record(good){let key=`${state.stage}/${state.round}/${state.index}/${state.step}`;state.events.push({key,stage:state.stage,good:!!good,at:new Date().toISOString()});save();}
function next(good){record(good);state.reveal=false;let s=state.stage;
 if(s==='buildup'){let item=lesson.drills.buildup.items[state.index];if(state.step<item.steps.length-1){state.step++;save();render();return;}state.step=0;}
 if(s==='response'){let n=lesson.drills.response.pairs.length;state.index++;if(state.index>=n){state.index=0;state.round++;if(state.round>=3){sectionNext();return;}}save();render();return;}
 if(s==='conversation'){let rd=lesson.conversation.rounds[state.round];state.index++;if(state.index>=rd.pairs.length){state.index=0;state.round++;if(state.round>=3){sectionNext();return;}}save();render();return;}
 state.index++;if(state.index>=total()){sectionNext();return;}save();render();}
function panelFor(){let s=state.stage,i=state.index;
 if(s==='summary'){let all=state.events.length,ok=state.events.filter(x=>x.good).length;let per=stages.slice(0,6).map(x=>({label:x[1],all:state.events.filter(e=>e.stage===x[0]).length,ok:state.events.filter(e=>e.stage===x[0]&&e.good).length}));return `<div class="donebox"><div class="eyebrow">PRACTICE SUMMARY</div><h2>本輪練習完成</h2><p class="desc">這裡是你按「我答得出來」的自評紀錄，不代表口說自動評分。</p><div class="meta"><div><b>${all}</b><small>累積回答次數</small></div><div><b>${ok}</b><small>自評答得出來</small></div><div><b>${all?Math.round(100*ok/all):0}%</b><small>自評熟悉度</small></div></div><div class="mini-cards">${per.map(x=>`<div>${x.label}：${x.ok} / ${x.all} 次自評可回答</div>`).join('')}</div><div class="actions"><button class="btn primary full" id="again">從語塊重新練習</button></div></div>`;}
 if(s==='chunks'){let c=lesson.chunks[i];return head('語塊 Chunks',count(lesson.chunks.length))+prompt('核心語塊',c.text)+cue('中文意思',c.meaning)+`<p class="explain">${safe(c.usage)}</p><div class="answer"><div class="caption">使用例句</div><div class="sentence">${safe(c.example)}</div></div><div class="actions">${sayButton(c.text,'▶ 聆聽語塊')} ${sayButton(c.example,'▶ 聆聽例句')}<button class="btn primary full" id="nextChunk">下一個 →</button></div>`;}
 if(s==='substitution'){let d=lesson.drills.substitution,q=d.items[i];return head('替換 Substitution',count(d.items.length))+`<p class="explain">${safe(d.instruction)}</p>`+prompt('固定句型',d.pattern)+cue('替換詞組',q.cue)+`<div class="actions">${sayButton(q.cue,'▶ 聆聽提示')}</div>${state.reveal?answer(q.answer):''}`+controls();}
 if(s==='buildup'){let d=lesson.drills.buildup,q=d.items[i],s=q.steps[state.step];return head('堆疊 Buildup',`${count(d.items.length)} · 第 ${state.step+1} / ${q.steps.length} 步`)+`<p class="explain">${safe(q.label)}。每一層要重新說完整句。</p>`+prompt('這一步要說',s)+`<div class="actions">${sayButton(s,'▶ 聆聽句子')}</div>`+`<div class="actions"><button class="btn" data-score="0">再練一次</button><button class="btn primary full" data-score="1">完成這一步 →</button></div>`;}
 if(s==='transformation'){let d=lesson.drills.transformation,q=d.items[i];return head('轉換 Transformation',count(d.items.length))+prompt('原句',q.original)+cue('轉換規則',q.rule)+`<div class="actions">${sayButton(q.original,'▶ 聆聽原句')}</div>${state.reveal?answer(q.answer):''}`+controls();}
 if(s==='response'){let d=lesson.drills.response,round=state.round,q=d.pairs[i],rate=d.rates[round];return head('問答 Response',`第 ${round+1}/3 輪 · ${count(d.pairs.length)}`)+`<p class="explain">同一段問答練三輪，逐次加快。第 ${round+1} 輪為 ${rate.toFixed(2)}×。</p>`+prompt('A · 系統提問',q.a)+`<div class="actions">${sayButton(q.a,'▶ 播放 A',rate)}</div>`+`<div class="cue"><div class="caption">B · 換你回答</div><div class="sentence">${state.reveal?'參考答案如下':'先自己開口說，不看答案'}</div></div>${state.reveal?answer(q.b,rate):''}`+controls('我回答了 · 顯示 B');}
 if(s==='conversation'){let rd=lesson.conversation.rounds[state.round],q=rd.pairs[i];return head('完整對話 Conversation',`${rd.name} · ${state.round+1}/3 · ${count(rd.pairs.length)}`)+`<p class="explain">${safe(rd.scenario)}　這一輪語速 ${rd.rate.toFixed(2)}×。</p>`+prompt('A · 對話對象',q.a)+`<div class="actions">${sayButton(q.a,'▶ 播放 A',rd.rate)}</div>`+`<div class="cue"><div class="caption">B · 你</div><div class="sentence">${state.reveal?'請核對你的回答':'現在換你回應（先不看答案）'}</div></div>${state.reveal?answer(q.b,rd.rate):''}`+controls('完成回答 · 顯示參考');}
 }

function renderCourses(){
 if(!manifest)return;
 $('#coursebar').innerHTML=`<section class="coursebar" aria-label="課程清單">
 <div class="course-title"><div><strong>課程清單 · ${manifest.lessons.length} 堂</strong><br><span>選擇課程後可隨時再練習</span></div><button type="button" id="toggleLessons" class="course-toggle" aria-expanded="${coursesOpen}">${coursesOpen?'收合':'展開'}課程</button></div>
 <div id="course-grid" class="course-grid" ${coursesOpen?'':'hidden'}>${manifest.lessons.map((x,i)=>`<button type="button" data-lesson="${safe(x.id)}" class="course-card ${lesson?.id===x.id?'active':''}"><span class="course-index">LESSON ${String(i+1).padStart(2,'0')}</span><b>${safe(x.title)}</b><small>${safe(x.title_zh||'')}</small></button>`).join('')}</div></section>`;
}
async function loadLesson(meta){
 if(!meta)throw Error('找不到此課程');
 const res=await fetch(meta.file,{cache:'no-store'});
 if(!res.ok)throw Error('無法讀取課程資料：'+meta.title);
 const obj=await res.json();
 if(obj.id!==meta.id)throw Error('教材與課程索引不一致');
 lesson=obj;
 STORE='fsi-chunks-v1:'+lesson.id;
 state=INITIAL();
 try{let saved=JSON.parse(localStorage.getItem(STORE)||'null');if(!saved&&lesson.lesson_number===1){saved=JSON.parse(localStorage.getItem('fsi-chunks-v1:lesson-01')||'null');}if(saved&&Array.isArray(saved.events)){state={...state,...saved};save();}}catch(e){}
 if(!stages.some(x=>x[0]===state.stage))state.stage='chunks';
 if(!Number.isInteger(state.index)||state.index<0)state.index=0;
 localStorage.setItem('fsi-chunks-selected-lesson',lesson.id);
 renderCourses();
 render();
}

function render(){if(!lesson)return;$('#title').textContent=lesson.title;$('#subtitle').textContent=`${lesson.title_zh} · ${lesson.learning_objective}`;$('#meta').innerHTML=`<div class="meta"><div><b>${lesson.chunks.length}</b><small>核心語塊</small></div><div><b>4</b><small>FSI 式訓練</small></div><div><b>3</b><small>完整對話輪次</small></div></div>`;$('#nav').innerHTML=stages.map(x=>`<button class="tab ${state.stage===x[0]?'active':''}" data-stage="${x[0]}">${x[1]}</button>`).join('');$('#panel').innerHTML=panelFor()+`<p class="toast" id="status" role="status"></p><div class="progress"><div style="width:${Math.round(100*(state.index+1)/(total()||1))}%"></div></div><div class="linkrow"><a href="${safe(lesson.source.source_url)}" target="_blank" rel="noopener">國務院原始教材 ↗</a><a href="${safe(lesson.source.source_audio)}" target="_blank" rel="noopener">教材原始 MP3 ↗</a></div>`;}
function bind(){document.addEventListener('click',async e=>{let t=e.target.closest('button');if(!t)return;
 if(t.dataset.lesson){try{speechSynthesis.cancel();await loadLesson(manifest.lessons.find(x=>x.id===t.dataset.lesson));}catch(err){$('#panel').innerHTML='<p class="desc">'+safe(err.message)+'</p>';}return;}
 if(t.id==='toggleLessons'){coursesOpen=!coursesOpen;renderCourses();return;}
 if(t.dataset.stage){setStage(t.dataset.stage);return;}
 if(t.dataset.say){voice(decodeURIComponent(t.dataset.say),t.dataset.rate);return;}
 if(t.dataset.score!==undefined){next(t.dataset.score==='1');return;}
 if(t.id==='reveal'){state.reveal=true;save();render();return;}
 if(t.id==='nextChunk'){if(state.index+1>=lesson.chunks.length){sectionNext()}else{state.index++;save();render();}return;}
 if(t.id==='again'||t.id==='restart'){state.cycles++;setStage('chunks');return;}
 });}
async function boot(){bind();try{const r=await fetch('curriculum/index.json',{cache:'no-store'});if(!r.ok)throw Error('課程索引載入失敗');manifest=await r.json();const savedId=localStorage.getItem('fsi-chunks-selected-lesson');await loadLesson(manifest.lessons.find(x=>x.id===savedId)||manifest.lessons[0]);}catch(e){$('#title').textContent='教材載入失敗';$('#panel').innerHTML=`<p>${safe(e.message)}</p><p class="desc">請將整個專案資料夾部署到 HTTPS 靜態網站，不要只上傳 index.html；直接以 file:// 開啟可能無法讀取 JSON。</p>`;}}
boot();
</script></body></html>
